.page-root-body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#1E2740;background:#FBF8F2}

<div class="bar" role="navigation" aria-label="Pages de la maquette">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>
      ORDINATEUR
    </button>
    <button type="button" id="mode-m" class="modebtn" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
      TÉLÉPHONE
    </button>
  </div>
  <div class="grp" id="grp"></div>
  <label class="saison">Temps liturgique
    <select id="saison">
      <option value="ordinaire">Temps ordinaire (vert)</option>
      <option value="avent">Avent (violet)</option>
      <option value="noel">Temps de Noël (blanc / or)</option>
      <option value="careme">Carême (violet)</option>
      <option value="paques">Temps pascal (blanc / or)</option>
      <option value="joie">Gaudete, Laetare (rose)</option>
      <option value="rouge">Pentecôte, martyrs (rouge)</option>
    </select>
  </label>
  <strong class="title">Maquette v3 · charte graphique appliquée</strong>
  <span class="note">Maquette à valider par le curé et l'EAP — les mentions entre crochets [ ] signalent une information à compléter. Les menus, boutons et filtres fonctionnent.</span>
</div>
<main id="view"></main>
<template id="tpl-Main"><div style="width: 1440px; height: 5800px; display: flex; flex-direction: column; background: #FBF8F2; color: #1E2740; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6">

  <dc-import name="Header" active="accueil" hint-size="1440px,176px"></dc-import>

  <!-- Bandeau d'accueil -->
  <section style="padding: 72px 120px 88px; display: flex; gap: 64px; align-items: center">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: #8A5E1A">BIENVENUE À LA PAROISSE DE BRY-SUR-MARNE</span>
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; font-weight: 600; line-height: 1.04">Une église ouverte au cœur de Bry, depuis près de neuf siècles</h1>
      <p style="margin: 0; font-size: 20px; color: #4A4E5C; max-width: 560px">Chaque semaine, la communauté se rassemble pour célébrer, prier et accueillir. L'église, ouverte tous les jours, abrite un trésor unique : le Diorama peint par Louis Daguerre en 1842.</p>
      <div style="display: flex; gap: 14px; padding-top: 8px">
        <a href="Messes.dc.html" style="display: flex; align-items: center; gap: 10px; background: #1E2740; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px; padding: 15px 26px; border-radius: 6px">Horaires des messes
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
        <a href="Patrimoine.dc.html" style="display: flex; align-items: center; background: transparent; color: #1E2740; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px 26px; border-radius: 6px; border: 1.5px solid #1E2740">Découvrir le Diorama</a>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #4A4E5C; padding-top: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Église ouverte tous les jours de 8h30 à 19h (le dimanche jusqu'à 17h)
      </div>
    </div>
    <div style="width: 580px; height: 460px; flex-shrink: 0; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFE7D8 0 14px, #F5EFE4 14px 28px); border: 1px dashed #C9B48A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #6F5A36; font-size: 15px; font-weight: 600; text-align: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span>Photo à fournir<br>L'église Saint-Gervais &amp; Saint-Protais, vue de la Grande rue</span>
    </div>
  </section>

  <!-- Fil d'actualités -->
  <section aria-labelledby="fil-titre" style="padding: 72px 120px 80px; background: #F3EDE2; border-top: 1px solid #E6DCC8; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: #8A5E1A">À LA UNE</span>
        <h2 id="fil-titre" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1.1">Fil d'actualités</h2>
      </div>
      <a href="#" style="font-weight: 700; font-size: 17px; color: #8A5E1A; text-decoration: none">Toutes les actualités →</a>
    </div>
    <div style="display: flex; gap: 32px; align-items: stretch">
      <article style="width: 680px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: #FFFFFF; border: 1px solid #E6DCC8; display: flex; flex-direction: column">
        <div style="position: relative; height: 380px; background: repeating-linear-gradient(135deg, #E4D9C4 0 14px, #EDE4D3 14px 28px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5E4B2C; font-size: 15px; font-weight: 600; text-align: center">
          <span style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; background: #7A2E3A; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; padding: 7px 14px; border-radius: 999px">
            <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#FFFFFF"></circle></svg>
            EN CE MOMENT · 25–28 SEPTEMBRE
          </span>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span>Photo du pape Léon XIV<br>(image libre de droits ou photothèque officielle, avec crédit)</span>
        </div>
        <div style="padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 10px">
          <span style="align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #7A2E3A; background: #F5E6E8; padding: 4px 12px; border-radius: 999px">ÉGLISE UNIVERSELLE</span>
          <h3 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 36px; font-weight: 600; line-height: 1.1">Le pape Léon XIV en France : Paris, Lourdes et Metz</h3>
          <p style="margin: 0; font-size: 17px; color: #4A4E5C">Du 25 au 28 septembre, sous la devise « Pour que le monde ait la vie », le pape rencontre les jeunes au Stade de France, célèbre la messe à Paris, puis se rend à Lourdes et à Metz. Unissons-nous à ce voyage par la prière.</p>
          <a href="https://www.pape-france.fr" style="align-self: flex-start; margin-top: 6px; font-weight: 700; font-size: 17px; color: #FFFFFF; background: #1E2740; text-decoration: none; padding: 13px 22px; border-radius: 6px">Suivre le voyage sur pape-france.fr →</a>
        </div>
      </article>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
        <div role="group" aria-label="Filtrer le fil" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <sc-if value="{{f.active}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{f.pick}}" style="font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: 1.5px solid #1E2740; background: #1E2740; color: #FFFFFF; cursor: pointer">{{f.label}}</button>
            </sc-if>
            <sc-if value="{{f.inactive}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{f.pick}}" style="font: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1.5px solid #BFB29A; background: #FFFFFF; color: #1E2740; cursor: pointer">{{f.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E6DCC8; border-radius: 16px; display: flex; flex-direction: column">
          <sc-for list="{{news}}" as="n" hint-placeholder-count="5">
            <li style="display: flex; gap: 18px; padding: 20px 24px; border-bottom: 1px solid #EFE7D8">
              <span style="width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; background: #FBF8F2; border: 1px solid #E6DCC8; padding: 8px 0">
                <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1">{{n.day}}</span>
                <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #4A4E5C">{{n.month}}</span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 3px">
                <sc-if value="{{n.isParoisse}}" hint-placeholder-val="{{true}}"><span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #7A5516; background: #F5ECDB; padding: 2px 10px; border-radius: 999px">PAROISSE</span></sc-if>
                <sc-if value="{{n.isDoyenne}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #245069; background: #E3EEF4; padding: 2px 10px; border-radius: 999px">DOYENNÉ</span></sc-if>
                <sc-if value="{{n.isUniv}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #7A2E3A; background: #F5E6E8; padding: 2px 10px; border-radius: 999px">ÉGLISE UNIVERSELLE</span></sc-if>
                <strong style="font-size: 18px; line-height: 1.3">{{n.title}}</strong>
                <span style="font-size: 15px; color: #4A4E5C; line-height: 1.45">{{n.text}}</span>
              </span>
            </li>
          </sc-for>
        </ul>
      </div>
    </div>
  </section>

  <!-- Messes de la semaine -->
  <section style="padding: 72px 120px; background: #FFFFFF; border-top: 1px solid #E6DCC8; border-bottom: 1px solid #E6DCC8; display: flex; flex-direction: column; gap: 36px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: #8A5E1A">HORAIRES</span>
        <h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1.1">Les messes à l'église</h2>
      </div>
      <a href="Messes.dc.html" style="font-weight: 700; font-size: 17px; color: #8A5E1A; text-decoration: none">Toutes les messes à Bry, chapelles comprises →</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
      <div style="padding: 32px; border-radius: 14px; background: #FBF8F2; border: 1px solid #E6DCC8; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: #8A5E1A">SAMEDI</span>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; font-weight: 600; line-height: 1">18h30</span>
        <span style="font-size: 19px; font-weight: 600">Messe anticipée du dimanche</span>
        <span style="font-size: 16px; color: #4A4E5C">Sauf en juillet et août</span>
      </div>
      <div style="padding: 32px; border-radius: 14px; background: #1E2740; color: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: #D9B56A">DIMANCHE</span>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; font-weight: 600; line-height: 1">10h30</span>
        <span style="font-size: 19px; font-weight: 600">Messe dominicale</span>
        <span style="font-size: 16px; color: #D5D0C4">Toute l'année</span>
      </div>
      <div style="padding: 32px; border-radius: 14px; background: #FBF8F2; border: 1px solid #E6DCC8; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: #8A5E1A">MARDI</span>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; font-weight: 600; line-height: 1">19h00</span>
        <span style="font-size: 19px; font-weight: 600">Messe, précédée du chapelet (17h45) et de l'adoration (18h15)</span>
        <span style="font-size: 16px; color: #4A4E5C">Le dernier mardi du mois, messe pour les défunts. Pas de messe en semaine en juillet-août.</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-radius: 10px; background: #F3EDE2; font-size: 16px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
      <span>Changements exceptionnels : consultez <strong>MessesInfo</strong> (site et application) ou <strong>la Lettre du Messager Bryard</strong> du mois.</span>
    </div>
  </section>

  <!-- Démarches -->
  <section style="padding: 88px 120px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 820px">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: #8A5E1A">DÉMARCHES</span>
      <h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1.1">Vous souhaitez…</h2>
      <p style="margin: 0; color: #4A4E5C">Toutes les demandes passent par le secrétariat : <strong style="color: #1E2740">01 49 83 99 39</strong> (mardi, jeudi, vendredi, 9h–14h) ou <strong style="color: #1E2740">info@paroisse-bry.fr</strong>.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
      <a href="EtapesVie.dc.html" style="text-decoration: none; color: #1E2740; padding: 28px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6DCC8; display: flex; gap: 18px; align-items: flex-start">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #F3EDE2; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 27px; font-weight: 600; line-height: 1.15">Faire baptiser un enfant</span><span style="font-size: 16px; color: #4A4E5C">Pour un enfant, un jeune ou un adulte.</span><span style="font-size: 15px; font-weight: 700; color: #8A5E1A; padding-top: 6px">En savoir plus →</span></span>
      </a>
      <a href="EtapesVie.dc.html" style="text-decoration: none; color: #1E2740; padding: 28px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6DCC8; display: flex; gap: 18px; align-items: flex-start">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #F3EDE2; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="14" r="5"></circle><circle cx="15" cy="14" r="5"></circle><path d="M10 4l2 3 2-3"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 27px; font-weight: 600; line-height: 1.15">Se marier à l'église</span><span style="font-size: 16px; color: #4A4E5C">Les étapes de la préparation au mariage.</span><span style="font-size: 15px; font-weight: 700; color: #8A5E1A; padding-top: 6px">En savoir plus →</span></span>

  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { this.state = Object.assign({}, this.state, p); render(); }
  forceUpdate() { render(); }
}
const classes = {};
for (const k in COMPS) classes[k] = COMPS[k](DCLogic);
const instances = {};
function getInst(key, name, props) {
  let i = instances[key];
  if (!i) { i = new classes[name](props); instances[key] = i; }
  i.props = props;
  return i;
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function lookup(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.');
  let v = scope[parts[0]];
  for (let j = 1; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
  return v;
}
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (m, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
}
function renderComp(name, props, key) {
  const inst = getInst(key, name, props);
  const vals = inst.renderVals() || {};
  const frag = document.getElementById('tpl-' + name).content.cloneNode(true);
  processChildren(frag, vals, key);
  return frag;
}
function processChildren(parent, scope, key) {
  Array.from(parent.childNodes).forEach((n) => processNode(n, scope, key));
}
function processNode(n, scope, key) {
  if (n.nodeType === 3) { if (n.nodeValue.indexOf('{{') >= 0) n.nodeValue = interp(n.nodeValue, scope); return; }
  if (n.nodeType === 8) { n.remove(); return; }
  if (n.nodeType !== 1) return;
  const tag = n.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const m = (n.getAttribute('list') || '').match(WHOLE);
    const list = (m && lookup(m[1], scope)) || [];
    const as = n.getAttribute('as') || 'item';
    const out = document.createDocumentFragment();
    list.forEach((it, idx) => {
      const c = document.createDocumentFragment();
      Array.from(n.childNodes).forEach((ch) => c.appendChild(ch.cloneNode(true)));
      const sc = Object.assign({}, scope, { [as]: it, $index: idx });
      processChildren(c, sc, key);
      out.appendChild(c);
    });
    n.replaceWith(out);
    return;
  }
  if (tag === 'sc-if') {
    const m = (n.getAttribute('value') || '').match(WHOLE);
    const v = m ? lookup(m[1], scope) : false;
    if (v) { processChildren(n, scope, key); n.replaceWith(...Array.from(n.childNodes)); }
    else n.remove();
    return;
  }
  if (tag === 'dc-import') {
    const name = n.getAttribute('name');
    const props = {};
    for (const a of Array.from(n.attributes)) {
      if (a.name === 'name' || a.name.indexOf('hint-') === 0) continue;
      const camel = a.name.replace(/-([a-z])/g, (mm, c) => c.toUpperCase());
      const w = a.value.match(WHOLE);
      props[camel] = w ? lookup(w[1], scope) : interp(a.value, scope);
    }
    n.replaceWith(renderComp(name, props, key + '/' + name));
    return;
  }
  for (const a of Array.from(n.attributes)) {
    if (a.value.indexOf('{{') < 0) continue;
    const w = a.value.match(WHOLE);
    if (a.name.indexOf('on') === 0) {
      const fn = w ? lookup(w[1], scope) : null;
      n.removeAttribute(a.name);
      if (typeof fn === 'function') n.addEventListener(a.name.slice(2), (e) => { e.preventDefault(); fn(e); });
    } else {
      n.setAttribute(a.name, interp(a.value, scope));
    }
  }
  processChildren(n, scope, key);
}
function fit() {
  const f = document.querySelector('#view .frame');
  if (!f) return;
  const w = isMobile(current) ? 410 : 1440;
  const s = Math.min(1, (window.innerWidth - 32) / w);
  f.style.zoom = s;
}
function render() {
  const view = document.getElementById('view');
  const y = window.scrollY;
  view.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'frame ' + (isMobile(current) ? 'm' : 'd');
  wrap.appendChild(renderComp(current, {}, current));
  view.appendChild(wrap);
  const root = wrap.firstElementChild;
  if (root) { root.style.height = 'auto'; root.style.minHeight = '0'; }
  fit();
  window.scrollTo(0, y);
  buildButtons();
}
function navigate(n) {
  if (!classes[n]) return;
  current = n;
  history.replaceState(null, '', '#' + n);
  window.scrollTo(0, 0);
  render();
}
document.getElementById('view').addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const h = a.getAttribute('href');
  const m = h.match(/^\/?([A-Za-z0-9_-]+)\.dc\.html$/);
  if (m) { e.preventDefault(); navigate(m[1]); return; }
  if (h === '#') { e.preventDefault(); return; }
  if (h.charAt(0) === '#') {
    e.preventDefault();
    const t = document.getElementById(h.slice(1));
    if (t) t.scrollIntoView({ behavior: 'smooth' });
    return;
  }
  if (/^https?:/.test(h)) a.setAttribute('target', '_blank');
});
document.getElementById('view').addEventListener('submit', (e) => e.preventDefault());
const EQUIV = { Main: 'Mobile', Messes: 'MobileMesses', EtapesVie: 'MobileEtapes' };
function buildButtons() {
  const mode = isMobile(current) ? 'm' : 'd';
  document.getElementById('mode-d').setAttribute('aria-pressed', String(mode === 'd'));
  document.getElementById('mode-m').setAttribute('aria-pressed', String(mode === 'm'));
  const g = document.getElementById('grp');
  g.innerHTML = '';
  PAGES.filter((p) => p[2] === mode).forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[1];
    b.dataset.page = p[0];
    b.setAttribute('aria-current', String(p[0] === current));
    b.addEventListener('click', () => navigate(p[0]));
    g.appendChild(b);
  });
}
function setMode(mode) {
  if ((mode === 'm') === isMobile(current)) return;
  if (mode === 'm') navigate(EQUIV[current] || 'Mobile');
  else {
    const back = Object.keys(EQUIV).find((k) => EQUIV[k] === current);
    navigate(back || 'Main');
  }
}
document.getElementById('mode-d').addEventListener('click', () => setMode('d'));
document.getElementById('mode-m').addEventListener('click', () => setMode('m'));
window.__saison = 'ordinaire';
document.getElementById('saison').addEventListener('change', (e) => { window.__saison = e.target.value; render(); });
window.addEventListener('resize', fit);
const start = location.hash.slice(1);
if (classes[start] && PAGES.some((p) => p[0] === start)) current = start;
render();
</script>
